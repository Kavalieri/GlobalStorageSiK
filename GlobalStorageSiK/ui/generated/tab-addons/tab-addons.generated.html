:root[data-profile="standard"] .sik-terminal-shell {

.sik-rail {

.sik-rail-tab.is-active::after { border-color: var(--sik-accent); background: linear-gradient(135deg, rgba(214,139,47,.16), rgba(0,0,0,.08)); box-shadow: inset 0 0 0 1px rgba(255,230,184,.22); }

.sik-icon-addons { background-image: url("icons/sik-rail-addons.png"); }

.sik-shell-main {
  min-width: 0;

  display: grid;
  grid-template-rows: var(--sik-window-header-height) minmax(0, 1fr) var(--sik-window-footer-height);
}

.sik-content-host {
  min-width: 0;
  min-height: 0;
  padding: var(--sik-window-content-inset);
  overflow: hidden;

}
.sik-content-host--flush { padding: 0; }
.sik-content-host--flush > .sik-surface-root {

.sik-status-dot { width: 6px; height: 6px; flex: 0 0 6px; border-radius: 50%; background: var(--sik-good); }

.sik-resize-grip {
  position: absolute;

  width: var(--sik-resize-grip);
  height: var(--sik-resize-grip);
  pointer-events: none;
  background: repeating-linear-gradient(135deg, transparent 0 3px, #616161 3px 4px);

.sik-block {
  min-width: 0;
  min-height: 0;
  padding: var(--sik-block-padding);
  border: 1px solid var(--sik-border);
  background: var(--sik-panel);

.sik-block:has(> .sik-block-header) {

.sik-block > .sik-block-header { width: 100%; margin: 0; }
.sik-block > .sik-block-header ~ * { width: 100%; min-width: 0; margin-left: 0; margin-right: 0; }

.sik-block--scrollable {
  padding-left: var(--sik-block-padding);

.sik-block--fill {

.sik-block--fill > .sik-block-viewport,

.sik-block--fill > .sik-red-body,

.sik-surface-root {

.sik-surface-root > .sik-block-viewport,
.sik-surface-root > .sik-scroll-region {
  height: auto;
  flex: 1 1 auto;
  min-height: 0;
}
.sik-surface-root > .sik-block--fill {
  height: auto;
  flex: 1 1 auto;
  min-height: 0;
}
.sik-surface-root > .sik-surface-panel {
  flex: 1 1 auto;
  min-height: 0;
}
.sik-surface-panel { min-width: 0; min-height: 0; height: 100%; overflow: hidden; }
.sik-surface-panel--fill { display: grid; grid-template-rows: auto minmax(0, 1fr); }
.sik-surface-panel--fill > .sik-block-viewport,

.sik-block-header {

.sik-block-header .sik-button { margin-left: auto; }

.sik-block-viewport,

    @media (max-width:899px) {

<script>(() => {
  "use strict";

  const params = new URLSearchParams(window.location.search);
  const requestedProfile = params.get("profile");
  const validProfiles = new Set(["compact", "standard", "wide"]);

  function automaticProfile() {
    if (window.innerWidth < 900 || window.innerHeight < 700) return "compact";
    if (window.innerWidth >= 1400 && window.innerHeight >= 800) return "wide";
    return "standard";
  }

  function applyProfile() {
    document.documentElement.dataset.profile = validProfiles.has(requestedProfile)
      ? requestedProfile
      : automaticProfile();
  }

  function activateTab(button) {
    const group = button.closest("[data-tab-group]");
    if (!group) return;
    const key = button.dataset.tab;
	document.documentElement.dataset.activeTab = key;
    group.querySelectorAll("[data-tab]").forEach((candidate) => {
      candidate.classList.toggle("is-active", candidate === button);
    });
    const scope = group.parentElement || document;
    scope.querySelectorAll("[data-panel]").forEach((panel) => {
      panel.hidden = panel.dataset.panel !== key;
    });
    requestAnimationFrame(refreshOverflow);
  }

  function activateState(option) {
    const group = option.closest("[data-state-group]");
    if (!group) return;
    const key = option.dataset.stateOption;
    group.dataset.state = key;
    document.documentElement.dataset.state = key;
    group.querySelectorAll("[data-state-option]").forEach((candidate) => {
      candidate.classList.toggle("is-active", candidate === option);
    });
    group.querySelectorAll("[data-state-view]").forEach((view) => {
	  const states = String(view.dataset.stateView || "").split(/\s+/);
      view.hidden = !states.includes(key);
    });
    requestAnimationFrame(refreshOverflow);
  }

  function findByDataset(selector, field, value) {
    return Array.from(document.querySelectorAll(selector)).find((candidate) => candidate.dataset[field] === value);
  }

  function findAllByDataset(selector, field, value) {
    return Array.from(document.querySelectorAll(selector)).filter((candidate) => candidate.dataset[field] === value);
  }

  function configureTable(table) {
    const header = table.querySelector(".sik-table-head");
    if (!header) return;
    const columns = Array.from(header.children).filter((cell) => cell.hasAttribute("data-col"));
    if (!columns.length) return;
    const tracks = columns.map((cell) => {
      const width = Number(cell.dataset.width);
      if (Number.isFinite(width) && width > 0) return width + "px";
      const min = Number(cell.dataset.min);
      const flex = Number(cell.dataset.flex);
      return "minmax(" + (Number.isFinite(min) && min >= 0 ? min : 0) + "px," +
        (Number.isFinite(flex) && flex > 0 ? flex : 1) + "fr)";
    });
    table.style.setProperty("--sik-table-columns", tracks.join(" "));
    table.querySelectorAll(".sik-table-row").forEach((row) => {
      Array.from(row.children).forEach((cell, index) => {
        const descriptor = columns[index];
        if (!descriptor) return;
        cell.dataset.key = descriptor.dataset.key || "col" + index;
        cell.dataset.align = descriptor.dataset.align || "left";
      });
    });
    columns.slice(0, -1).forEach((cell, index) => {
      if (cell.querySelector(".sik-column-resizer")) return;
      const handle = document.createElement("span");
      handle.className = "sik-column-resizer";
      handle.setAttribute("aria-hidden", "true");
      handle.addEventListener("pointerdown", (event) => {
        event.preventDefault();
        event.stopPropagation();
        const headerCells = Array.from(header.children).filter((candidate) => candidate.hasAttribute("data-col"));
        const widths = headerCells.map((candidate) => candidate.getBoundingClientRect().width);
        const startX = event.clientX;
        handle.classList.add("is-dragging");
        handle.setPointerCapture(event.pointerId);
        handle.onpointermove = (move) => {
          const delta = move.clientX - startX;
          const leftMin = Math.max(40, Number(headerCells[index].dataset.min) || 40);
          const rightMin = Math.max(40, Number(headerCells[index + 1].dataset.min) || 40);
          const left = Math.max(leftMin, Math.min(widths[index] + delta, widths[index] + widths[index + 1] - rightMin));
          const right = widths[index] + widths[index + 1] - left;
          const next = widths.map((width, position) => position === index ? left : position === index + 1 ? right : width);
          table.style.setProperty("--sik-table-columns", next.map((width) => Math.round(width) + "px").join(" "));
        };
        handle.onpointerup = () => {
          handle.classList.remove("is-dragging");
          handle.onpointermove = null;
          handle.onpointerup = null;
        };
      });
      cell.appendChild(handle);
    });
    table.dataset.sikTableReady = "true";
  }

  function setModal(open) {
    document.querySelectorAll("[data-modal]").forEach((modal) => {
      modal.classList.toggle("is-open", open);
      modal.setAttribute("aria-hidden", open ? "false" : "true");
    });
  }

  function applyReviewFilter(filter) {
    document.querySelectorAll("[data-review-card]").forEach((card) => {
      card.hidden = filter !== "all" && card.dataset.family !== filter;
    });
    document.querySelectorAll("[data-filter]").forEach((button) => {
      button.classList.toggle("is-active", button.dataset.filter === filter);
    });
  }

  function toggleTableGroup(row) {
    const key = row.dataset.expandGroup;
    if (!key) return;
    const children = findAllByDataset("[data-group-child]", "groupChild", key);
    const expanded = row.getAttribute("aria-expanded") !== "false";
    children.forEach((child) => { child.hidden = expanded; });
    row.setAttribute("aria-expanded", expanded ? "false" : "true");
    const marker = row.querySelector(".sik-expander");
    if (marker) marker.textContent = expanded ? "▶" : "▼";
    const table = row.closest(".sik-table");
    if (table?.classList.contains("sik-warehouse-table")) {
      refreshInlinePagers(table);
      filterWarehouse();
    }
    else refreshInlinePagers(table || document);
    requestAnimationFrame(refreshOverflow);
  }

  function getInlinePagerRows(pager) {
    const table = pager.closest(".sik-table");
    const key = pager.dataset.groupChild;
    if (!table || !key) return [];
    return Array.from(table.querySelectorAll(`[data-group-child="${key}"]`)).filter((row) => !row.classList.contains("sik-pager-row"));
  }

  function refreshInlinePager(pager) {
    const rows = getInlinePagerRows(pager);
    if (!rows.length) return;
    const pages = Array.from(new Set(rows.map((row) => Number(row.dataset.pagerPage || 1)))).sort((left, right) => left - right);
    const requestedPage = Number(pager.dataset.currentPage || pages[0]);
    const page = pages.includes(requestedPage) ? requestedPage : pages[0];
    pager.dataset.currentPage = String(page);
    const visibleRows = rows.filter((row) => Number(row.dataset.pagerPage || 1) === page);
    const first = Math.min(...visibleRows.map((row) => Number(row.dataset.pagerRowIndex || 1)));
    const last = Math.max(...visibleRows.map((row) => Number(row.dataset.pagerRowIndex || first)));
    const totalUnits = visibleRows.reduce((sum, row) => sum + (Number(row.dataset.pagerUnits) || 0), 0);
    const label = pager.querySelector("[data-pager-label]");
    if (label) label.textContent = `Mostrando ${first}–${last} de ${rows.length} líneas · ${totalUnits} objetos`;
    pager.querySelectorAll("[data-pager-direction]").forEach((button) => {
      button.disabled = button.dataset.pagerDirection === "previous" ? page === pages[0] : page === pages[pages.length - 1];
    });
    const parent = pager.closest(".sik-table")?.querySelector(`[data-expand-group="${pager.dataset.groupChild}"]`);
    if (!pager.closest(".sik-warehouse-table")) {
      const expanded = parent?.getAttribute("aria-expanded") !== "false";
      rows.forEach((row) => { row.hidden = !expanded || Number(row.dataset.pagerPage || 1) !== page; });
      pager.hidden = !expanded;
    }
  }

  function refreshInlinePagers(scope = document) {
    if (!scope) return;
    const pagers = scope.matches?.(".sik-pager-row") ? [scope] : scope.querySelectorAll?.(".sik-pager-row");
    Array.from(pagers || []).forEach(refreshInlinePager);
  }

  function changeInlinePager(button) {
    const pager = button.closest(".sik-pager-row");
    if (!pager || button.disabled) return;
    const rows = getInlinePagerRows(pager);
    const pages = Array.from(new Set(rows.map((row) => Number(row.dataset.pagerPage || 1)))).sort((left, right) => left - right);
    const current = Number(pager.dataset.currentPage || pages[0]);
    const index = pages.indexOf(current);
    const next = button.dataset.pagerDirection === "previous" ? pages[index - 1] : pages[index + 1];
    if (!next) return;
    pager.dataset.currentPage = String(next);
    const table = pager.closest(".sik-table");
    if (table?.classList.contains("sik-warehouse-table")) {
      refreshInlinePager(pager);
      filterWarehouse();
    }
    else refreshInlinePagers(table || document);
    requestAnimationFrame(refreshOverflow);
  }

  function refreshOverflow() {
    document.querySelectorAll(".sik-block-viewport, .sik-scroll-region").forEach((viewport) => {
      const active = !viewport.hidden && viewport.clientHeight > 0;
      viewport.classList.toggle("has-overflow", active && viewport.scrollHeight > viewport.clientHeight + 1);
    });
  }

  function installBlockHelp() {
    document.querySelectorAll(".sik-block-header[data-help]").forEach((header) => {
      const alert = header.querySelector(".sik-alert");
      if (alert) {
        header.querySelector(".sik-info")?.remove();
        alert.setAttribute("data-control-tooltip", "");
        let tooltip = alert.querySelector(".sik-tooltip");
        if (!tooltip) {
          tooltip = document.createElement("span");
          tooltip.className = "sik-tooltip";
          alert.appendChild(tooltip);
        }
        tooltip.textContent = header.dataset.help;
        return;
      }
      if (header.querySelector(".sik-info")) return;
      const button = document.createElement("button");
      button.className = "sik-info";
      button.type = "button";
      button.setAttribute("aria-label", "Información");
      const tooltip = document.createElement("span");
      tooltip.className = "sik-tooltip";
      tooltip.textContent = header.dataset.help;
      button.appendChild(tooltip);
      header.insertBefore(button, header.firstChild);
    });
  }

  function installFloatingTooltips() {
    const triggers = document.querySelectorAll(".sik-info, .sik-rail-tab, .sik-addon-slot, .sik-status-code, [data-control-tooltip]");
    triggers.forEach((trigger) => {
      if (trigger.dataset.floatingTooltipBound === "true") return;
      trigger.dataset.floatingTooltipBound = "true";
      let floating = null;
      const show = () => {
        if (floating) return;
        const source = trigger.querySelector(":scope > .sik-tooltip, :scope > .sik-row-tooltip");
        if (!source) return;
        floating = source.cloneNode(true);
        floating.classList.add("sik-floating-tooltip");
        const preferredWidth = trigger.classList.contains("sik-addon-slot") ? 360
          : trigger.classList.contains("sik-rail-tab") ? 250 : 240;
        floating.style.width = Math.min(preferredWidth, window.innerWidth - 24) + "px";
        document.body.appendChild(floating);
        const rect = trigger.getBoundingClientRect();
        const tipRect = floating.getBoundingClientRect();
        let left = trigger.classList.contains("sik-rail-tab") ? rect.right + 8 : rect.left;
        left = Math.max(12, Math.min(left, window.innerWidth - tipRect.width - 12));
        let top = rect.bottom + 6;
        if (top + tipRect.height > window.innerHeight - 12) top = rect.top - tipRect.height - 6;
        floating.style.left = left + "px";
        floating.style.top = Math.max(12, top) + "px";
      };
      const hide = () => {
        if (floating) floating.remove();
        floating = null;
      };
      trigger.addEventListener("pointerenter", show);
      trigger.addEventListener("pointerleave", hide);
      trigger.addEventListener("focus", show);
      trigger.addEventListener("blur", hide);
      trigger.closest("dialog")?.addEventListener("close", hide);
    });
  }

  function installItemTooltips() {
    document.querySelectorAll(".sik-warehouse-table .sik-table-row:not(.sik-table-head):not(.sik-pager-row)").forEach((row) => {
      if (row.dataset.itemTooltipBound === "true") return;
      row.dataset.itemTooltipBound = "true";
      let floating = null;
      row.addEventListener("pointerenter", () => {
        const cells = Array.from(row.children).slice(0, 4);
        const title = cells[0]?.textContent.trim() || "Objeto";
        const count = row.querySelector('[data-key="count"]')?.textContent.trim() || "1";
        const networkName = document.querySelector(".sik-window-context")?.textContent.trim() || "SiK Test Network";
        floating = document.createElement("div");
        floating.className = "sik-item-tooltip sik-item-tooltip-preview sik-floating-tooltip";
        const head = document.createElement("div");
        head.className = "sik-item-tooltip-head";
        const icon = cells[0]?.querySelector(".sik-item-swatch")?.cloneNode(true) || document.createElement("i");
        if (!icon.classList.contains("sik-item-swatch")) icon.className = "sik-item-swatch is-misc";
        const name = document.createElement("span");
        name.textContent = title.replace(/^[▼▶·]\s*/, "");
        head.append(icon, name);
        const vanilla = document.createElement("div");
        vanilla.className = "sik-item-tooltip-vanilla";
        const semantic = document.createElement("span");
        if (row.classList.contains("is-group")) semantic.textContent = `Grupo agregado · ${count} unidades`;
        else if (/bid[oó]n/i.test(title)) semantic.textContent = `Contenido y peso de esta unidad: ${title.match(/\d+%/)?.[0] || "vacío"}`;
        else if (/vhs|woodcraft|exposure|contenido desconocido/i.test(title)) semantic.textContent = `Contenido grabado: ${name.textContent}`;
        else semantic.textContent = "Información vanilla de esta unidad";
        vanilla.appendChild(semantic);
        if (/woodcraft/i.test(title)) {
          const teaching = document.createElement("span");
          teaching.textContent = "Enseña: Carpintería";
          vanilla.appendChild(teaching);
        }
        const gs = document.createElement("div");
        gs.className = "sik-item-tooltip-gs";
        const stock = document.createElement("span");
        stock.textContent = `${networkName}: ${count} en tu red`;
        gs.append(stock);
        floating.append(head, vanilla, gs);
        document.body.appendChild(floating);
        const rect = row.getBoundingClientRect();
        const tipRect = floating.getBoundingClientRect();
        const left = Math.max(12, Math.min(rect.left + 20, window.innerWidth - tipRect.width - 12));
        let top = rect.bottom + 6;
        if (top + tipRect.height > window.innerHeight - 12) top = rect.top - tipRect.height - 6;
        floating.style.left = left + "px";
        floating.style.top = Math.max(12, top) + "px";
      });
      row.addEventListener("pointerleave", () => {
        if (floating) floating.remove();
        floating = null;
      });
    });
  }

  function foldText(value) {
    return String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
  }

  function filterWarehouse() {
    const table = document.querySelector(".sik-warehouse-table");
    if (!table) return;
    const query = foldText(document.querySelector("[data-warehouse-search]")?.value);
    const family = document.querySelector("[data-warehouse-family]")?.dataset.selected || "all";
    const group = document.querySelector("[data-warehouse-group]")?.dataset.selected || "all";
    const detail = document.querySelector("[data-warehouse-detail]")?.dataset.selected || "all";
    table.querySelectorAll(".sik-table-row:not(.sik-table-head)").forEach((row) => {
      const childGroup = row.dataset.groupChild;
      const parent = childGroup ? table.querySelector(`[data-expand-group="${childGroup}"]`) : null;
      if (row.classList.contains("sik-pager-row")) {
        row.hidden = !parent || parent.getAttribute("aria-expanded") === "false" || Boolean(query) || family !== "all";
        return;
      }
      const visibleCells = Array.from(row.children).filter((child) => !child.classList.contains("sik-row-tooltip"));
      const visibleText = visibleCells.slice(0, 4).map((cell) => cell.textContent).join(" ");
      const textMatch = !query || foldText(visibleText).includes(query);
      const folded = foldText(visibleText);
      let rowFamily = row.dataset.family;
      if (!rowFamily) {
        if (folded.includes("comida y bebida")) rowFamily = "food";
        else if (folded.includes("vehiculos")) rowFamily = "vehicles";
        else if (folded.includes("contenedores")) rowFamily = "containers";
        else if (folded.includes("conocimiento y medios")) rowFamily = "knowledge";
        else if (folded.includes("materiales")) rowFamily = "materials";
        else if (folded.includes("misc") || folded.includes("sin clasificar")) rowFamily = "misc";
        else if (folded.includes("varias categorias")) rowFamily = "mixed";
        else rowFamily = "all";
      }
      const semanticGroup = row.dataset.expandGroup || childGroup || "";
      const rowGroup = semanticGroup === "crisps" ? "nonperishable"
        : semanticGroup === "fuel" ? "consumables"
        : semanticGroup === "vhs" ? "media"
        : semanticGroup === "nails" ? "component" : "all";
      const rowDetail = semanticGroup === "crisps" ? "otherfood"
        : semanticGroup === "fuel" ? "fuel"
        : semanticGroup === "nails" ? "fixing" : "all";
      const declaredFamilies = String(row.dataset.families || "").split(/\s+/).filter(Boolean);
      const familyMatch = family === "all" || rowFamily === family || declaredFamilies.includes(family);
      const groupMatch = group === "all" || rowGroup === group;
      const detailMatch = detail === "all" || rowDetail === detail;
      const collapsed = childGroup && parent && parent.getAttribute("aria-expanded") === "false";
      const filtering = Boolean(query) || family !== "all" || group !== "all" || detail !== "all";
      const pager = childGroup ? table.querySelector(`.sik-pager-row[data-group-child="${childGroup}"]`) : null;
      const offPage = pager && Number(row.dataset.pagerPage || 1) !== Number(pager.dataset.currentPage || 1);
      row.hidden = !(textMatch && familyMatch && groupMatch && detailMatch) || (collapsed && !filtering) || offPage;
    });
    refreshOverflow();
  }

  document.addEventListener("click", (event) => {
    const nodeRow = event.target.closest("[data-open-node]");
    if (nodeRow && !event.target.closest(".sik-column-resizer")) {
      const source = document.querySelector('[data-surface-id="editor-node"] .sik-editor-preview');
      if (source) {
        const dialog = document.createElement("dialog");
        dialog.className = "sik-confirm-dialog sik-node-dialog";
        dialog.setAttribute("aria-label", "Editar contenedor · " + nodeRow.dataset.nodeName);
        const editor = source.cloneNode(true);
        editor.querySelector(".sik-window-header > span").textContent =
          "Editar contenedor · " + nodeRow.dataset.nodeName + " · " + nodeRow.dataset.zoneName;
        editor.querySelector('input[aria-label="Nombre del contenedor"]').value = nodeRow.dataset.nodeName;
        editor.querySelector(".sik-priority-field").value = nodeRow.querySelector('[data-key="priority"]').textContent;
        editor.querySelectorAll("[data-floating-tooltip-bound], [data-item-tooltip-bound]").forEach((node) => {
          delete node.dataset.floatingTooltipBound;
          delete node.dataset.itemTooltipBound;
        });
        editor.querySelectorAll(".sik-column-resizer").forEach((node) => node.remove());
        dialog.appendChild(editor);
        document.body.appendChild(dialog);
        editor.querySelector(".sik-window-close").addEventListener("click", () => dialog.close());
        dialog.addEventListener("close", () => { dialog.remove(); nodeRow.focus(); });
        installFloatingTooltips();
        installItemTooltips();
        editor.querySelectorAll("[data-sik-table]").forEach(configureTable);
        dialog.showModal();
        editor.querySelector('input[aria-label="Nombre del contenedor"]').focus();
        refreshOverflow();
      }
    }
    const zoneDelete = event.target.closest("[data-confirm-zone]");
    if (zoneDelete) {
      const source = document.querySelector('[data-state-view="modal-confirm"] .sik-modal');
      if (source) {
        const dialog = document.createElement("dialog");
        dialog.className = "sik-confirm-dialog";
        dialog.setAttribute("aria-label", "Confirmar eliminación de zona");
        dialog.appendChild(source.cloneNode(true));
        dialog.querySelectorAll("[data-floating-tooltip-bound]").forEach((node) => {
          delete node.dataset.floatingTooltipBound;
        });
        document.body.appendChild(dialog);
        installBlockHelp();
        installFloatingTooltips();
        dialog.querySelectorAll(".sik-window-close, .sik-modal-actions .sik-button").forEach((button) => {
          button.addEventListener("click", () => dialog.close());
        });
        dialog.addEventListener("close", () => { dialog.remove(); zoneDelete.focus(); });
        dialog.showModal();
        dialog.querySelector(".sik-modal-actions .sik-button")?.focus();
      }
    }
    const pagerButton = event.target.closest("[data-pager-direction]");
    if (pagerButton) {
      changeInlinePager(pagerButton);
      return;
    }
    const tab = event.target.closest("[data-tab]");
    if (tab) activateTab(tab);

    const combo = event.target.closest("[data-combo]");
    if (combo) {
      const wasOpen = combo.classList.contains("is-open");
      document.querySelectorAll("[data-combo].is-open").forEach((candidate) => candidate.classList.remove("is-open"));
      if (!wasOpen) combo.classList.add("is-open");
    }

    const comboOption = event.target.closest(".sik-combo-option");
    if (comboOption) {
      const wrap = comboOption.closest(".sik-combo-wrap");
      const owner = wrap?.querySelector("[data-combo]");
      if (owner) {
        owner.textContent = comboOption.textContent;
        owner.dataset.selected = comboOption.dataset.value || "all";
        owner.classList.remove("is-open");
        filterWarehouse();
      }
    }

    const state = event.target.closest("[data-state-option]");
    if (state) activateState(state);

    const priorityPreset = event.target.closest(".sik-priority-presets [data-priority-value]");
    if (priorityPreset) {
      const block = priorityPreset.closest(".sik-block");
      const field = block?.querySelector(".sik-priority-field");
      if (field) field.value = priorityPreset.dataset.priorityValue;
      block?.querySelectorAll(".sik-priority-presets [data-priority-value]").forEach((button) => {
        button.classList.toggle("is-active", button === priorityPreset);
      });
    }

    const palette = event.target.closest(".sik-palette-option");
    if (palette) {
      const paletteClass = Array.from(palette.classList).find((name) => name.startsWith("is-palette-"));
      const key = paletteClass ? paletteClass.slice("is-palette-".length) : "graphite";
      document.documentElement.dataset.palette = key;
      document.querySelectorAll(".sik-palette-option").forEach((option) => option.classList.toggle("is-active", option === palette));
    }

    const action = event.target.closest("[data-action]");
    if (action?.dataset.action === "open-modal") setModal(true);
    if (action?.dataset.action === "close-modal") setModal(false);

    const filter = event.target.closest("[data-filter]");
    if (filter) applyReviewFilter(filter.dataset.filter);

    const group = event.target.closest("[data-expand-group]");
    if (group) toggleTableGroup(group);

    const preview = event.target.closest("[data-preview-query]");
    if (preview) {
      const frame = document.getElementById(preview.dataset.previewTarget || "terminal-tabs-review");
      if (frame) frame.src = (preview.dataset.previewSource || "terminal-tabs.html") + "?" + preview.dataset.previewQuery;
      document.querySelectorAll("[data-preview-query]").forEach((button) => button.classList.toggle("is-active", button === preview));
    }

    if (!event.target.closest(".sik-combo-wrap")) {
      document.querySelectorAll("[data-combo].is-open").forEach((candidate) => candidate.classList.remove("is-open"));
    }
  });

  document.addEventListener("keydown", (event) => {
    if ((event.key === "Enter" || event.key === " ") && event.target.matches("[data-open-node]")) {
      event.preventDefault();
      event.target.click();
    }
    if (event.key === "Escape") setModal(false);
    if (event.key === "Escape") document.querySelectorAll("[data-combo].is-open").forEach((candidate) => candidate.classList.remove("is-open"));
  });

  document.addEventListener("input", (event) => {
    if (event.target.matches("[data-warehouse-search]")) filterWarehouse();
    if (event.target.matches(".sik-priority-field")) {
      const value = event.target.value;
      event.target.closest(".sik-block")?.querySelectorAll(".sik-priority-presets [data-priority-value]").forEach((button) => {
        button.classList.toggle("is-active", button.dataset.priorityValue === value);
      });
    }
  });

  applyProfile();
  installBlockHelp();
  installFloatingTooltips();
  installItemTooltips();
  document.querySelectorAll("[data-sik-table]").forEach(configureTable);
  refreshInlinePagers();
  const requestedTab = params.get("tab");
  if (requestedTab) {
    const tab = findByDataset("[data-tab]", "tab", requestedTab);
    if (tab) activateTab(tab);
  }
  const requestedState = params.get("state");
  if (requestedState) {
    findAllByDataset("[data-state-option]", "stateOption", requestedState).forEach(activateState);
  }
  if (params.get("modal") === "open" || window.location.hash === "#modal") setModal(true);
  refreshOverflow();
  window.addEventListener("resize", () => { if (!validProfiles.has(requestedProfile)) applyProfile(); refreshOverflow(); });
  if (window.ResizeObserver) {
    const observer = new ResizeObserver(refreshOverflow);
    document.querySelectorAll(".sik-block-viewport, .sik-scroll-region").forEach((viewport) => observer.observe(viewport));
  }
})();

/* Product state fixture; uses the existing rail interaction and shared components. */
(() => {
  const reader = new URLSearchParams(location.search).get('reader') || 'installed';
  const installed = reader === 'installed';
  document.documentElement.dataset.reader = reader;
  const tab = document.querySelector('[data-tab="programming"]');
  const panel = document.querySelector('[data-panel="programming"]');
  if (!installed) {
    if (tab.classList.contains('is-active')) document.querySelector('[data-tab="warehouse"]').click();
    tab.hidden = true;
    panel.hidden = true;
    panel.inert = true;
    const slot = document.querySelector('[data-addon-id="Reader"]');
    slot.dataset.addonState = 'not-installed';
    slot.classList.remove('is-active');
    const label = slot.querySelector('[data-addon-part="stateLabel"]');
    label.textContent = 'No instalado aquí';
    label.classList.remove('is-installed');
    const tooltip = slot.querySelector('.sik-tooltip em');
    tooltip.textContent = 'Instala la disquetera en este terminal para abrir Programación.';
  }
})();
</script>
